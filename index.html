<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Sound Local</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>

    <!-- Title -->
    <section id="title" class="screen active">
      <div class="card hero">
        <h1>Sound Local</h1>
        <p class="sub">Travel the world. Learn how people really talk. Convince the locals.</p>
        <button id="play" class="btn big">Play</button>
      </div>
    </section>

    <!-- World map -->
    <section id="map" class="screen">
      <div class="map-wrap">
        <h2>Where to?</h2>
        <div class="map" style="background-image: url(assets/images/world-map.webp)">
          <button class="pin live" data-place="scotland" style="left: 42.6%; top: 34.9%">
            <span class="dot"></span><span class="label">Scotland</span>
          </button>
        </div>
        <p class="hint">More places coming soon</p>
      </div>
    </section>

    <!-- Placement test -->
    <section id="test" class="screen">
      <div class="hud">
        <div class="step" id="step">1 / 3</div>
        <div class="trust">
          <span>Trust</span>
          <div class="bar"><div class="fill" id="trust-fill"></div></div>
        </div>
      </div>
      <div class="bubble" id="bubble"><b id="speaker">The Devin Otter</b><span id="bubble-text"></span></div>
      <div class="prompt" id="prompt">
        <div class="level" id="level">Easy</div>
        <div class="line" id="line"></div>
        <div class="meaning" id="meaning"></div>
        <div class="heard" id="heard"></div>
        <svg class="melody" id="melody" viewBox="0 0 240 48" preserveAspectRatio="none" aria-label="Your melody compared with the otter's"><polyline id="mel-ref" /><polyline id="mel-you" /></svg>
        <div class="sing">
          <canvas class="live" id="live" aria-label="Your voice, live, over the otter's melody"></canvas>
          <div class="match" id="match"></div>
          <div class="legend"><i class="o"></i>Otter <i class="y"></i>You</div>
        </div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="pops" id="pops"></div>
      <div class="talkrow">
        <button id="again-line" class="replay" aria-label="Hear the otter again">Hear it again</button>
        <button id="talk" class="talk" aria-label="Hold to talk">
          <span class="ring" id="ring"></span><span class="mic"></span><span id="talk-label">Hold to talk</span>
        </button>
      </div>
    </section>

    <!-- Result -->
    <section id="result" class="screen">
      <div class="card result-card">
        <p class="sub">The Devin Otter places you as a</p>
        <h1 id="result-level">Visitor</h1>
        <p id="result-score" class="sub"></p>
        <ol class="path" id="path"></ol>
        <div class="row">
          <button id="again" class="btn">Try again</button>
          <button id="to-map" class="btn ghost">World map</button>
        </div>
      </div>
    </section>

    <button id="mute" class="mute" aria-label="Mute">Sound on</button>
    <div id="credit">Built with Devin · Voices by ElevenLabs · 3D by Meshy</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
