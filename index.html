<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Sound Local</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>

    <!-- Title -->
    <section id="title" class="screen active">
      <div class="card hero">
        <h1>Sound Local</h1>
        <p class="sub">Travel the world. Learn how people really talk. Convince the locals.</p>
        <button id="play" class="btn big">Play</button>
      </div>
    </section>

    <!-- World map -->
    <section id="map" class="screen">
      <div class="map-wrap">
        <h2>Where to?</h2>
        <div class="map">
          <button class="pin live" data-place="scotland" style="left: 47.5%; top: 24%">
            <span class="dot"></span><span class="label">Scotland</span>
          </button>
          <div class="pin soon" style="left: 45%; top: 27%"><span class="dot"></span><span class="label">Ireland</span></div>
          <div class="pin soon" style="left: 21%; top: 40%"><span class="dot"></span><span class="label">Texas</span></div>
          <div class="pin soon" style="left: 27%; top: 52%"><span class="dot"></span><span class="label">Jamaica</span></div>
          <div class="pin soon" style="left: 58%; top: 56%"><span class="dot"></span><span class="label">Nigeria</span></div>
          <div class="pin soon" style="left: 86%; top: 74%"><span class="dot"></span><span class="label">Australia</span></div>
          <div class="pin soon" style="left: 71%; top: 44%"><span class="dot"></span><span class="label">India</span></div>
        </div>
        <p class="hint">More places coming soon</p>
      </div>
    </section>

    <!-- Placement test -->
    <section id="test" class="screen">
      <div class="hud">
        <div class="step" id="step">1 / 3</div>
        <div class="trust">
          <span>Trust</span>
          <div class="bar"><div class="fill" id="trust-fill"></div></div>
        </div>
      </div>
      <div class="bubble" id="bubble"><b id="speaker">Morag the Otter</b><span id="bubble-text"></span></div>
      <div class="prompt" id="prompt">
        <div class="level" id="level">Easy</div>
        <div class="line" id="line"></div>
        <div class="meaning" id="meaning"></div>
        <div class="heard" id="heard"></div>
        <div class="tip" id="tip"></div>
      </div>
      <button id="talk" class="talk" aria-label="Hold to talk">
        <span class="mic"></span><span id="talk-label">Hold to talk</span>
      </button>
    </section>

    <!-- Result -->
    <section id="result" class="screen">
      <div class="card result-card">
        <p class="sub">Morag places you as a</p>
        <h1 id="result-level">Visitor</h1>
        <p id="result-score" class="sub"></p>
        <ol class="path" id="path"></ol>
        <div class="row">
          <button id="again" class="btn">Try again</button>
          <button id="to-map" class="btn ghost">World map</button>
        </div>
      </div>
    </section>

    <button id="mute" class="mute" aria-label="Mute">Sound on</button>
    <div id="credit">Built with Devin · Voices by ElevenLabs · 3D by Meshy</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
